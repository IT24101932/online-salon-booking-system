# ============================================================
# Online Salon Booking System - Application Configuration
# ============================================================

# Server Configuration
server.port=8080

# Database Configuration (SQL Server / MSSQL)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=salon_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=OnlineSalonBookingSystemSecretKeyForJWTAuthenticationThatIsLongEnoughToBeSecure2024
app.jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.salon=DEBUG
logging.level.org.springframework.security=DEBUG
